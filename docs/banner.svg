<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Droplet PINN Studio banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#081221"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b04b"/>
      <stop offset="1" stop-color="#4fc3f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- neural network schematic -->
  <g transform="translate(90,45)" stroke="#5b9bd5" stroke-width="2">
    <line x1="20" y1="60" x2="110" y2="30"/><line x1="20" y1="60" x2="110" y2="90"/><line x1="20" y1="60" x2="110" y2="150"/><line x1="20" y1="60" x2="110" y2="210"/>
    <line x1="20" y1="160" x2="110" y2="30"/><line x1="20" y1="160" x2="110" y2="90"/><line x1="20" y1="160" x2="110" y2="150"/><line x1="20" y1="160" x2="110" y2="210"/>
    <line x1="110" y1="30" x2="200" y2="60"/><line x1="110" y1="90" x2="200" y2="60"/><line x1="110" y1="150" x2="200" y2="60"/><line x1="110" y1="210" x2="200" y2="60"/>
    <line x1="110" y1="30" x2="200" y2="160"/><line x1="110" y1="90" x2="200" y2="160"/><line x1="110" y1="150" x2="200" y2="160"/><line x1="110" y1="210" x2="200" y2="160"/>
    <line x1="200" y1="60" x2="290" y2="110"/><line x1="200" y1="160" x2="290" y2="110"/>
    <g fill="#0b1d33">
      <circle cx="20" cy="60" r="13" fill="#e8b04b"/><circle cx="20" cy="160" r="13" fill="#e8b04b"/>
      <circle cx="110" cy="30" r="13"/><circle cx="110" cy="90" r="13"/><circle cx="110" cy="150" r="13"/><circle cx="110" cy="210" r="13"/>
      <circle cx="200" cy="60" r="13"/><circle cx="200" cy="160" r="13"/>
      <circle cx="290" cy="110" r="16" fill="#4fc3f7"/>
    </g>
    <text x="2" y="220" fill="#9fb8ce" font-family="Consolas, monospace" font-size="15">τ in</text>
    <text x="270" y="152" fill="#9fb8ce" font-family="Consolas, monospace" font-size="15">N(τ)</text>
  </g>
  <!-- learned vs exact curve panel -->
  <g transform="translate(460,55)">
    <rect x="0" y="0" width="230" height="200" rx="10" fill="#0e2440" stroke="#274b6d" stroke-width="2"/>
    <line x1="30" y1="170" x2="200" y2="170" stroke="#5b7a99" stroke-width="1.5"/>
    <line x1="30" y1="170" x2="30" y2="25" stroke="#5b7a99" stroke-width="1.5"/>
    <line x1="30" y1="170" x2="195" y2="40" stroke="#e8b04b" stroke-width="3.5"/>
    <path d="M 30 170 C 80 130, 130 100, 178 62" stroke="url(#curve)" stroke-width="3" stroke-dasharray="7 5" fill="none"/>
    <text x="60" y="192" fill="#9fb8ce" font-family="Consolas, monospace" font-size="14">τ</text>
    <text x="8" y="20" fill="#9fb8ce" font-family="Consolas, monospace" font-size="14">z</text>
    <text x="88" y="120" fill="#e8b04b" font-family="Consolas, monospace" font-size="14">z = 1 − τ</text>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="740" y="120" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="0.5">Droplet <tspan fill="#4fc3f7">PINN</tspan> Studio</text>
    <text x="742" y="165" fill="#9fb8ce" font-size="21">learning a droplet ODE with verifiable physics</text>
    <text x="742" y="203" fill="#5b7a99" font-family="Consolas, monospace" font-size="15">hard-IC ansatz vs soft-IC · equal budgets · 3 seeds</text>
  </g>
</svg>
